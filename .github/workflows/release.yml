name: Release

# Pushing a tag such as v0.1.0 builds the Windows zip and attaches it to the
# GitHub release of that tag (created if it does not exist yet).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-zip:
    name: Windows zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 zip
      - name: Check that the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rustycorn"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
      - name: Build the Windows bundle
        env:
          CARGO_TARGET_DIR: target
        run: packaging/windows/make_bundle.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
